
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOCALMATE | Admin Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#081510;color:#eef8f2;min-height:100vh;padding:20px}
.container{max-width:950px;margin:auto}
header{display:flex;justify-content:space-between;align-items:center;margin:15px 0 30px;gap:12px}
.logo{font-size:25px;font-weight:800;color:#21c982}
.logo span{color:white}
h1{font-size:27px;margin-bottom:8px}
.muted{color:#9aafa4;font-size:14px}
.card{background:#10231a;border:1px solid #254334;border-radius:16px;padding:22px;margin-bottom:18px}
input{width:100%;padding:14px;border-radius:9px;border:1px solid #355343;background:#081510;color:white;margin:14px 0}
button{border:0;border-radius:9px;padding:12px 17px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
.primary,.approve,.restore{background:#21c982;color:#06150d}
.secondary{background:#254334;color:white}
.reject{background:#a83d48;color:white}
.unpublish{background:#d18b35;color:#171006}
.hidden{display:none!important}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:22px 0}
.stat{background:#10231a;padding:17px;border-radius:12px;border:1px solid #254334}
.stat strong{display:block;font-size:25px;color:#21c982;margin-bottom:5px}
.business{background:#10231a;border:1px solid #254334;border-radius:14px;padding:18px;margin:14px 0}
.business h3{font-size:19px;margin-bottom:8px}
.business p{color:#b5c7bc;font-size:14px;margin:7px 0;overflow-wrap:anywhere}
.status{display:inline-block;padding:6px 10px;border-radius:20px;background:#254334;color:#b8f5d5;font-size:12px;margin:10px 0}
.actions{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.message{margin-top:12px;color:#ffb6b6;font-size:14px}
@media(max-width:650px){.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:550px){header{align-items:flex-start}h1{font-size:23px}}
</style>
</head>
<body>
<div class="container">

<header>
<div class="logo">LOCAL<span>MATE</span></div>
<button id="logoutBtn" class="secondary hidden">Logout</button>
</header>

<section id="loginSection" class="card">
<h1>Admin Login</h1>
<p class="muted">Authorized access only</p>
<form id="loginForm">
<input id="password" type="password" placeholder="Enter admin password" autocomplete="current-password" required>
<button class="primary" type="submit">Login</button>
</form>
<p id="loginMessage" class="message"></p>
</section>

<section id="dashboard" class="hidden">
<h1>Admin Dashboard</h1>
<p class="muted">Manage LOCALMATE business registrations.</p>

<div class="stats">
<div class="stat"><strong id="total">0</strong><span>Total</span></div>
<div class="stat"><strong id="pending">0</strong><span>Pending</span></div>
<div class="stat"><strong id="approved">0</strong><span>Approved</span></div>
<div class="stat"><strong id="rejected">0</strong><span>Rejected</span></div>
<div class="stat"><strong id="hiddenCount">0</strong><span>Hidden</span></div>
</div>

<div style="display:flex;justify-content:space-between;align-items:center;margin:25px 0 15px;gap:10px">
<h2>Business Registrations</h2>
<button class="secondary" onclick="loadBusinesses()">Refresh</button>
</div>

<p id="listMessage" class="muted"></p>
<div id="businessList"></div>
</section>
</div>

<script>
const loginSection=document.getElementById("loginSection");
const dashboard=document.getElementById("dashboard");
const loginMessage=document.getElementById("loginMessage");
const listMessage=document.getElementById("listMessage");
const businessList=document.getElementById("businessList");
const logoutBtn=document.getElementById("logoutBtn");

document.getElementById("loginForm").addEventListener("submit",async e=>{
 e.preventDefault();
 loginMessage.textContent="Checking...";

 try{
  const response=await fetch("/api/admin/login",{
   method:"POST",
   credentials:"same-origin",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
    password:document.getElementById("password").value
   })
  });

  const data=await response.json();
  if(!response.ok)throw new Error(data.error||"Login failed");

  loginSection.classList.add("hidden");
  dashboard.classList.remove("hidden");
  logoutBtn.classList.remove("hidden");
  document.getElementById("password").value="";
  await loadBusinesses();

 }catch(error){
  loginMessage.textContent=error.message;
 }
});

async function loadBusinesses(){
 listMessage.textContent="Loading registrations...";
 businessList.replaceChildren();

 try{
  const response=await fetch("/api/admin/businesses",{
   credentials:"same-origin"
  });

  if(response.status===401){
   showLogin("Please login again.");
   return;
  }

  const data=await response.json();
  if(!response.ok)throw new Error(data.error||"Could not load registrations");

  const businesses=Array.isArray(data)?data:[];

  document.getElementById("total").textContent=businesses.length;
  document.getElementById("pending").textContent=businesses.filter(x=>x.status==="pending").length;
  document.getElementById("approved").textContent=businesses.filter(x=>x.status==="approved").length;
  document.getElementById("rejected").textContent=businesses.filter(x=>x.status==="rejected").length;
  document.getElementById("hiddenCount").textContent=businesses.filter(x=>x.status==="hidden").length;

  listMessage.textContent=businesses.length
   ?"All submitted registrations"
   :"No registrations yet.";

  businesses.forEach(b=>{
   const card=document.createElement("div");
   card.className="business";

   const heading=document.createElement("h3");
   heading.textContent=b.business_name||"Unnamed business";
   card.append(heading);

   const details=[
    "Owner: "+(b.owner_name||"-"),
    "Category: "+(b.category||"-"),
    "City: "+(b.city||"-"),
    "Address: "+(b.address||"-"),
    "Phone: "+(b.phone||"-"),
    "WhatsApp: "+(b.whatsapp||"-"),
    "Description: "+(b.description||"-")
   ];

   details.forEach(value=>{
    const p=document.createElement("p");
    p.textContent=value;
    card.append(p);
   });

   const status=document.createElement("span");
   status.className="status";
   status.textContent="Status: "+(b.status||"pending").toUpperCase();
   card.append(status);

   const actions=document.createElement("div");
   actions.className="actions";

   if(b.status==="pending"){
    addButton(actions,"Approve","approve",()=>decide(b.id,"approved"));
    addButton(actions,"Reject","reject",()=>decide(b.id,"rejected"));
   }
   else if(b.status==="approved"){
    addButton(actions,"Unpublish","unpublish",()=>decide(b.id,"hidden"));
   }
   else if(b.status==="rejected"){
    addButton(actions,"Re-approve","approve",()=>decide(b.id,"approved"));
   }
   else if(b.status==="hidden"){
    addButton(actions,"Restore","restore",()=>restoreBusiness(b.id));
   }

   if(actions.children.length)card.append(actions);
   businessList.append(card);
  });

 }catch(error){
  listMessage.textContent=error.message;
 }
}

function addButton(parent,label,className,callback){
 const button=document.createElement("button");
 button.textContent=label;
 button.className=className;
 button.onclick=callback;
 parent.append(button);
}

async function decide(id,status){
 const action=status==="approved"?"approve":status==="hidden"?"hide":"reject";

 if(!confirm("Are you sure you want to "+action+" this business?"))return;

 try{
  const response=await fetch("/api/admin/decision",{
   method:"POST",
   credentials:"same-origin",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({id:Number(id),status:status})
  });

  const data=await response.json();
  if(!response.ok)throw new Error(data.error||"Action failed");

  await loadBusinesses();

 }catch(error){
  alert(error.message);
 }
}

async function restoreBusiness(id){
 if(!confirm("Restore this business to its previous status?"))return;

 try{
  const response=await fetch("/api/admin/restore",{
   method:"POST",
   credentials:"same-origin",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({id:Number(id)})
  });

  const data=await response.json();
  if(!response.ok)throw new Error(data.error||"Restore failed");

  await loadBusinesses();

 }catch(error){
  alert(error.message);
 }
}

function showLogin(message){
 dashboard.classList.add("hidden");
 loginSection.classList.remove("hidden");
 logoutBtn.classList.add("hidden");
 loginMessage.textContent=message;
}

logoutBtn.addEventListener("click",async()=>{
 try{
  await fetch("/api/admin/logout",{
   method:"POST",
   credentials:"same-origin"
  });
 }finally{
  showLogin("Logged out.");
 }
});
</script>
</body>
</html>
